  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Jost', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(ellipse at 50% 30%, var(--tint-light) 0%, var(--bg-outer) 70%);
      padding: 28px 20px 36px;
      transition: background 0.3s ease;
      --accent: #C08A6E;
      --accent-soft: rgba(192,138,110,0.14);
      --accent-border: rgba(192,138,110,0.35);
      --tint-light: #f6e9e2;
      --bg-outer: #f4f1ec;
      --text-main: #3c322d;
      --text-soft: rgba(60,50,45,0.55);
      --text-faint: rgba(60,50,45,0.45);
      --card-glass: rgba(255,255,255,0.55);
      --card-glass-top: rgba(255,255,255,0.65);
      --card-glass-top2: rgba(255,255,255,0.25);
      --card-glass-contact: rgba(255,255,255,0.35);
      --card-border: rgba(60,50,45,0.12);
      --card-border-soft: rgba(60,50,45,0.1);
      --btn-bg: rgba(255,255,255,0.6);
      --picker-active-border: #3c322d;
    }
    /* ---- palette picker ---- */
    .palette-picker {
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
      text-align: center;
    }
    .palette-picker p {
      font-size: 0.6rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 10px;
    }
    .swatches {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .swatch {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { border-color: var(--picker-active-border); transform: scale(1.12); }
    .swatch-num {
      font-family: 'Jost', Arial, sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .card {
      background: var(--card-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--text-main);
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      overflow: hidden;
      box-shadow: 0 0 40px var(--accent-soft), 0 8px 40px rgba(0,0,0,0.12);
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    .card .top {
      padding: 32px 32px 24px;
      text-align: center;
      background: linear-gradient(160deg, var(--card-glass-top) 0%, var(--card-glass-top2) 100%);
      border-bottom: 1px solid var(--card-border-soft);
      position: relative;
    }

    .card .logo {
      width: 280px;
      height: auto;
      margin: 0 auto 6px;
      display: block;
    }

    .card .role {
      font-family: 'Jost', Arial, sans-serif;
      font-size: 0.66rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .card .tagline {
      font-family: 'Jost', Arial, sans-serif;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--text-main);
      opacity: 0.8;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .card .sub {
      font-family: 'Jost', Arial, sans-serif;
      font-size: 0.68rem;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .card .strip {
      padding: 11px 20px;
      text-align: center;
      background: var(--accent-soft);
      border-top: 1px solid var(--accent-border);
      border-bottom: 1px solid var(--accent-border);
      font-family: 'Jost', Arial, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      white-space: normal;
      line-height: 1.8;
    }

    .card .contact {
      padding: 18px 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: var(--card-glass-contact);
    }

    .card .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-radius: 6px;
      font-family: 'Jost', Arial, sans-serif;
      font-size: 0.82rem;
      transition: opacity 0.18s ease, transform 0.1s ease, background 0.3s ease, border-color 0.3s ease;
      background: var(--btn-bg);
      border: 1px solid var(--card-border-soft);
      color: var(--text-main);
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .card .btn:hover { opacity: 0.75; transform: translateY(-1px); }

    .card .btn-icon { width: 20px; height: 20px; flex-shrink: 0; }

    .card .btn-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .card .btn-type {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.75;
    }

    .card .btn-value {
      font-family: 'Jost', Arial, sans-serif;
      font-size: 0.92rem;
      color: var(--text-main);
      word-break: break-all;
    }

    .card .btn-save {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      justify-content: center;
      gap: 10px;
      font-family: 'Jost', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    footer { margin-top: 20px; text-align: center; }
    .footer-link {
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-faint);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-link:hover { color: var(--text-soft); }
  </style>
</head>
<body>

    <div class="swatches">

      <div class="swatch" style="background:#7A3FA0" data-accent="#7A3FA0" data-soft="rgba(122,63,160,0.14)" data-border="rgba(122,63,160,0.4)" data-tint="#ecdcf5" title="5 — Morado real"><span class="swatch-num">5</span></div>
      <div class="swatch" style="background:#1F6FA8" data-accent="#1F6FA8" data-soft="rgba(31,111,168,0.14)" data-border="rgba(31,111,168,0.4)" data-tint="#d8e9f4" title="6 — Azul cobalto"><span class="swatch-num">6</span></div>
      <div class="swatch" style="background:#C22762" data-accent="#C22762" data-soft="rgba(194,39,98,0.14)" data-border="rgba(194,39,98,0.4)" data-tint="#f8dce7" title="7 — Magenta vino"><span class="swatch-num">7</span></div>
      <div class="swatch" style="background:#1E5F52" data-accent="#1E5F52" data-soft="rgba(30,95,82,0.14)" data-border="rgba(30,95,82,0.4)" data-tint="#d6e8e4" title="8 — Verde botella"><span class="swatch-num">8</span></div>
      <div class="swatch" style="background:#1B3A6B" data-accent="#1B3A6B" data-soft="rgba(27,58,107,0.14)" data-border="rgba(27,58,107,0.4)" data-tint="#dbe3f0" title="9 — Azul marino"><span class="swatch-num">9</span></div>
      <div class="swatch" style="background:#D6247A" data-accent="#D6247A" data-soft="rgba(214,36,122,0.14)" data-border="rgba(214,36,122,0.4)" data-tint="#fbdcec" title="10 — Fucsia"><span class="swatch-num">10</span></div>
      <div class="swatch" style="background:#8A7A1F" data-accent="#8A7A1F" data-soft="rgba(138,122,31,0.14)" data-border="rgba(138,122,31,0.4)" data-tint="#f0e9cc" title="11 — Mostaza olivo"><span class="swatch-num">11</span></div>
    </div>
  </div>

  <div class="card">

    <div class="top">

      <p class="role">Rol pendiente</p>

    <div class="contact">

      <button class="btn" onclick="copyClabe(this)" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#C08A6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">

          <polyline points="3 10 12 3 21 10"/>

        </svg>
        <span class="btn-label">
          <span class="btn-type">CLABE interbancaria BBVA</span>
          <span class="btn-value" id="clabe-id">012180001673171150</span>
        </span>
      </button>

      <button class="btn btn-save" onclick="saveContact()" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#C08A6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">

  <footer>

    </a>
  </footer>

  <script>
    function copyClabe(btn) {
      navigator.clipboard.writeText('012180001673171150').then(function() {
        var el = btn.querySelector('#clabe-id');
        var orig = el.textContent;
        el.textContent = '¡Copiado!';
        setTimeout(function() { el.textContent = orig; }, 2000);
      }).catch(function() {
        var range = document.createRange();
        range.selectNode(btn.querySelector('#clabe-id'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    }

    function saveContact() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Natasha Lozano',
        'N:Lozano;Natasha;;;',
        'TEL;TYPE=CELL,VOICE:+525554198253',
        'EMAIL:natasha.lozano@gmail.com',
        'NOTE:CLABE BBVA: 012180001673171150',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Natasha-Lozano.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }

    var swatches = document.querySelectorAll('.swatch');
    swatches.forEach(function(sw) {
      sw.addEventListener('click', function() {
        swatches.forEach(function(s) { s.classList.remove('active'); });
        sw.classList.add('active');
        var root = document.body.style;
        root.setProperty('--accent', sw.dataset.accent);
        root.setProperty('--accent-soft', sw.dataset.soft);
        root.setProperty('--accent-border', sw.dataset.border);
        root.setProperty('--tint-light', sw.dataset.tint);
        document.querySelectorAll('.btn-icon[fill]').forEach(function(icon) {
          if (icon.getAttribute('fill') !== 'none') icon.setAttribute('fill', sw.dataset.accent);
        });
        document.querySelectorAll('.btn-icon[stroke]').forEach(function(icon) {
          icon.setAttribute('stroke', sw.dataset.accent);
        });
      });
    });
  </script>

</body>
